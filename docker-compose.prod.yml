# Docker Compose override pour PRODUCTION avec Traefik
# Usage: docker-compose -f docker-compose.yaml -f docker-compose.prod.yml up -d

services:
  app:
    # Build avec APP_ENV=prod pour installer les dépendances sans dev
    build:
      args:
        APP_ENV: prod

    # Forcer APP_ENV=prod au runtime (override la valeur du .env)
    environment:
      APP_ENV: prod

    # Ne pas exposer les ports - Traefik s'en charge
    # IMPORTANT: !reset est nécessaire pour supprimer les ports du fichier base
    ports: !reset []

    # Labels Traefik pour routage et SSL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navinum.rule=Host(`activites-touristiques.online`)"
      - "traefik.http.routers.navinum.entrypoints=web,websecure"
      - "traefik.http.routers.navinum.tls=true"
      - "traefik.http.routers.navinum.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.navinum.priority=100"
      - "traefik.http.services.navinum.loadbalancer.server.port=80"
    
    # Utiliser Caddyfile de production
    volumes:
      - .:/app
      - ./Caddyfile.prod:/etc/frankenphp/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    
    # Rejoindre le réseau Traefik
    networks:
      - navinum_network
      - root_default

  mercure:
    # Ne pas exposer le port 3000 publiquement
    # IMPORTANT: !reset est nécessaire pour supprimer les ports du fichier base
    ports: !reset []

networks:
  root_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
  database_data:
