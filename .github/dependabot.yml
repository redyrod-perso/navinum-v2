# Mises à jour automatiques des dépendances : Dependabot ouvre des PR, la CI les teste.
# Regroupées par écosystème et par semaine pour limiter le bruit.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Symfony 8 : montée de version complète et coordonnée dans #46, pas composant par composant
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
    groups:
      symfony:
        patterns: ["symfony/*"]
      php-mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /assets/lib/navinum-api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Babel 8 : à traiter avec la montée de version de la chaîne de build (#46)
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    groups:
      js-mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies]
